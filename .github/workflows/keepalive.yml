name: Keepalive

# Belt-and-suspenders against Supabase's 7-day free-tier pause. The /30 ingest
# job already touches the DB, but if that's ever disabled this keeps it warm.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        if: vars.SITE_URL != ''
        run: |
          curl -fsS "${{ vars.SITE_URL }}/api/health" || echo "health ping failed (non-fatal)"
      - name: Touch Supabase directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -fsS "${SUPABASE_URL}/rest/v1/companies?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" || echo "supabase touch failed"
